<style>
  :root {
    --navy: #071A2B;
    --navy-2: #0E2942;
    --navy-3: #12334F;
    --emerald: #18B77A;
    --emerald-soft: rgba(24, 183, 122, .14);
    --gold: #C9A45C;
    --cream: #F7F4EC;
    --white: #FFFFFF;
    --muted: #AEBCC8;
    --ink: #17212A;
    --line: rgba(255,255,255,.1);
    --danger: #E77A7A;
    --warning: #E2B86B;
    --info: #78A9D1;
    --shadow: 0 24px 80px rgba(0,0,0,.24);
    --radius-lg: 28px;
    --radius-md: 18px;
    --radius-sm: 12px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--navy); color: var(--white); font-family: Inter, Arial, sans-serif; }
  body { min-height: 100vh; }
  button, input, textarea, select { font: inherit; }
  button { cursor: pointer; }
  a { color: inherit; }

  .app-shell {
    min-height: 100vh;
    background:
      radial-gradient(circle at 90% 10%, rgba(24,183,122,.13), transparent 30%),
      radial-gradient(circle at 5% 90%, rgba(201,164,92,.10), transparent 28%),
      var(--navy);
  }

  .boot-screen {
    min-height: 100vh;
    display: grid;
    place-content: center;
    text-align: center;
    gap: 18px;
    color: var(--muted);
  }
  .brand-mark {
    width: 74px;
    height: 74px;
    margin: 0 auto;
    display: grid;
    place-items: center;
    border-radius: 20px;
    background: var(--emerald);
    color: var(--navy);
    font-weight: 900;
    letter-spacing: .06em;
  }
  .boot-line {
    width: 160px;
    height: 4px;
    border-radius: 99px;
    background: rgba(255,255,255,.08);
    overflow: hidden;
    position: relative;
  }
  .boot-line::after {
    content: '';
    position: absolute;
    inset: 0;
    width: 45%;
    border-radius: inherit;
    background: var(--emerald);
    animation: loading 1.2s ease-in-out infinite alternate;
  }
  @keyframes loading { from { transform: translateX(-40%); } to { transform: translateX(160%); } }

  .topbar {
    height: 74px;
    padding: 0 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(14px);
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(7,26,43,.86);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-badge {
    width: 42px;
    height: 42px;
    border-radius: 13px;
    display: grid;
    place-items: center;
    background: var(--emerald);
    color: var(--navy);
    font-weight: 900;
  }
  .brand-copy strong { display: block; font-size: 14px; letter-spacing: .02em; }
  .brand-copy span { display: block; margin-top: 3px; font-size: 11px; color: var(--muted); }
  .top-actions { display: flex; gap: 10px; align-items: center; }

  .btn {
    border: 0;
    border-radius: 999px;
    padding: 12px 18px;
    font-weight: 800;
    transition: transform .18s ease, opacity .18s ease, background .18s ease;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
  .btn-primary { background: var(--emerald); color: var(--navy); }
  .btn-secondary { background: rgba(255,255,255,.08); color: var(--white); border: 1px solid var(--line); }
  .btn-ghost { background: transparent; color: var(--muted); }
  .btn-danger { background: rgba(231,122,122,.12); color: #FFD0D0; border: 1px solid rgba(231,122,122,.25); }
  .btn-large { padding: 15px 24px; font-size: 15px; }

  .landing {
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1.1fr .9fr;
  }
  .hero {
    padding: 9vw 7vw;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .eyebrow {
    color: var(--gold);
    font-size: 12px;
    font-weight: 900;
    letter-spacing: .18em;
    text-transform: uppercase;
  }
  .hero h1 {
    max-width: 780px;
    margin: 18px 0 22px;
    font-size: clamp(44px, 6vw, 82px);
    line-height: .98;
    letter-spacing: -.055em;
  }
  .hero h1 span { color: var(--emerald); }
  .hero > p {
    max-width: 650px;
    color: var(--muted);
    font-size: 18px;
    line-height: 1.7;
  }
  .promise-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-top: 34px;
    max-width: 720px;
  }
  .promise {
    padding: 18px;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    background: rgba(255,255,255,.035);
  }
  .promise strong { display: block; color: var(--white); margin-bottom: 8px; }
  .promise span { color: var(--muted); font-size: 12px; line-height: 1.5; }

  .entry-panel {
    min-height: 100vh;
    padding: 32px;
    display: grid;
    place-items: center;
    background: linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.01));
    border-left: 1px solid var(--line);
  }
  .entry-card {
    width: min(100%, 500px);
    padding: 34px;
    border-radius: var(--radius-lg);
    background: var(--cream);
    color: var(--ink);
    box-shadow: var(--shadow);
  }
  .entry-card h2 { margin: 8px 0 10px; font-size: 30px; letter-spacing: -.03em; }
  .entry-card > p { color: #65717C; line-height: 1.6; }
  .tabs { display: flex; gap: 8px; padding: 6px; background: #E9E5DC; border-radius: 999px; margin: 24px 0; }
  .tab { flex: 1; border: 0; border-radius: 999px; padding: 10px; background: transparent; font-weight: 800; color: #6D7780; }
  .tab.active { background: var(--white); color: var(--ink); box-shadow: 0 4px 14px rgba(0,0,0,.08); }

  .field { margin-bottom: 20px; }
  .field label { display: block; margin-bottom: 8px; font-weight: 850; font-size: 14px; }
  .field .required { color: var(--emerald); margin-left: 4px; }
  .field input, .field textarea, .field select {
    width: 100%;
    border: 1px solid #D8D5CE;
    background: var(--white);
    border-radius: 14px;
    padding: 14px 15px;
    color: var(--ink);
    outline: 0;
    transition: border-color .18s ease, box-shadow .18s ease;
  }
  .field textarea { min-height: 130px; resize: vertical; line-height: 1.55; }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--emerald); box-shadow: 0 0 0 4px rgba(24,183,122,.12); }
  .field-help { margin-top: 7px; font-size: 12px; color: #77828B; line-height: 1.45; }
  .field-error { margin-top: 7px; color: #A83B3B; font-size: 12px; font-weight: 700; }
  .checkbox-line { display: flex; gap: 10px; align-items: flex-start; }
  .checkbox-line input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--emerald); }
  .checkbox-line label { margin: 0; font-weight: 650; line-height: 1.45; }

  .journey-shell { min-height: 100vh; }
  .journey-grid {
    display: grid;
    grid-template-columns: 310px minmax(0, 1fr);
    min-height: calc(100vh - 74px);
  }
  .sidebar {
    padding: 28px 22px;
    border-right: 1px solid var(--line);
    background: rgba(255,255,255,.018);
  }
  .project-mini {
    padding: 18px;
    border-radius: var(--radius-md);
    background: var(--navy-2);
    border: 1px solid var(--line);
    margin-bottom: 22px;
  }
  .project-mini span { display: block; color: var(--muted); font-size: 11px; margin-bottom: 7px; }
  .project-mini strong { display: block; font-size: 15px; line-height: 1.35; }
  .progress-overall { margin-top: 14px; }
  .progress-row { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 8px; }
  .progress-track { height: 8px; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden; }
  .progress-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--emerald), #67D4A8); transition: width .4s ease; }
  .step-list { display: grid; gap: 8px; }
  .step-item {
    width: 100%;
    border: 0;
    display: grid;
    grid-template-columns: 34px 1fr auto;
    gap: 11px;
    align-items: center;
    text-align: left;
    padding: 11px 12px;
    border-radius: 14px;
    color: var(--muted);
    background: transparent;
  }
  .step-item:hover { background: rgba(255,255,255,.04); }
  .step-item.active { background: var(--emerald-soft); color: var(--white); }
  .step-index { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 10px; background: rgba(255,255,255,.06); font-size: 11px; font-weight: 900; }
  .step-item.active .step-index { background: var(--emerald); color: var(--navy); }
  .step-copy strong { display: block; font-size: 12px; }
  .step-copy span { display: block; margin-top: 4px; font-size: 10px; color: inherit; opacity: .75; }
  .step-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.14); }
  .step-dot.complete { background: var(--emerald); }

  .workspace { padding: 52px clamp(24px, 5vw, 76px); }
  .workspace-inner { max-width: 880px; margin: 0 auto; }
  .section-head { margin-bottom: 26px; }
  .section-head .section-count { color: var(--gold); font-size: 11px; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; }
  .section-head h2 { margin: 10px 0 10px; font-size: clamp(30px, 4vw, 48px); letter-spacing: -.04em; }
  .section-head p { color: var(--muted); line-height: 1.65; max-width: 720px; }
  .question-card {
    background: var(--cream);
    color: var(--ink);
    border-radius: var(--radius-lg);
    padding: clamp(24px, 4vw, 42px);
    box-shadow: var(--shadow);
  }
  .question-grid { display: grid; gap: 2px; }
  .question-card .field { padding: 18px 0; margin: 0; border-bottom: 1px solid #E1DDD5; }
  .question-card .field:last-child { border-bottom: 0; }
  .question-card .field label { font-size: 16px; }
  .card-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
    margin-top: 24px;
  }
  .save-state { color: var(--muted); font-size: 12px; min-width: 160px; }
  .save-state.saved { color: #8EDCB9; }
  .save-state.error { color: #FFB2B2; }

  .review-panel { max-width: 980px; margin: 0 auto; }
  .score-hero {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 28px;
    align-items: center;
    padding: 34px;
    border-radius: var(--radius-lg);
    background: var(--cream);
    color: var(--ink);
    box-shadow: var(--shadow);
  }
  .score-ring {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: conic-gradient(var(--emerald) var(--score-deg), #E6E2DA 0);
    position: relative;
  }
  .score-ring::after { content: ''; position: absolute; inset: 14px; background: var(--cream); border-radius: 50%; }
  .score-value { position: relative; z-index: 1; text-align: center; }
  .score-value strong { display: block; font-size: 46px; letter-spacing: -.05em; }
  .score-value span { font-size: 12px; color: #6E7880; }
  .score-copy h2 { margin: 0 0 10px; font-size: 34px; letter-spacing: -.035em; }
  .score-copy p { color: #66737D; line-height: 1.65; }
  .score-meta { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 18px; }
  .pill { padding: 9px 12px; border-radius: 999px; background: #EAE6DE; font-size: 12px; font-weight: 800; }

  .result-grid { display: grid; grid-template-columns: 1.05fr .95fr; gap: 22px; margin-top: 22px; }
  .panel {
    padding: 26px;
    border-radius: var(--radius-md);
    border: 1px solid var(--line);
    background: rgba(255,255,255,.035);
  }
  .panel h3 { margin: 0 0 16px; font-size: 18px; }
  .alert-list { display: grid; gap: 10px; }
  .alert-item {
    padding: 15px;
    border-radius: 14px;
    background: rgba(255,255,255,.04);
    border-left: 4px solid var(--info);
  }
  .alert-item.critique { border-left-color: var(--danger); }
  .alert-item.importante { border-left-color: var(--warning); }
  .alert-item.amelioration { border-left-color: var(--emerald); }
  .alert-item strong { display: block; font-size: 13px; margin-bottom: 5px; }
  .alert-item p { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.5; }
  .alert-item small { display: block; margin-top: 8px; color: var(--cream); line-height: 1.45; }

  .category-list { display: grid; gap: 12px; }
  .category-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
  .category-row span { font-size: 12px; color: var(--muted); }
  .category-row strong { font-size: 12px; }
  .category-bar { grid-column: 1 / -1; height: 6px; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden; }
  .category-bar i { display: block; height: 100%; background: var(--emerald); border-radius: inherit; }

  .generate-card {
    margin-top: 22px;
    padding: 26px;
    border-radius: var(--radius-md);
    background: linear-gradient(135deg, rgba(24,183,122,.16), rgba(201,164,92,.08));
    border: 1px solid rgba(24,183,122,.28);
    display: flex;
    justify-content: space-between;
    gap: 22px;
    align-items: center;
  }
  .generate-card h3 { margin: 0 0 8px; }
  .generate-card p { margin: 0; color: var(--muted); line-height: 1.55; }

  .downloads { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 18px; }
  .download-card { text-decoration: none; padding: 18px; border-radius: 16px; background: rgba(255,255,255,.06); border: 1px solid var(--line); }
  .download-card strong { display: block; margin-bottom: 6px; }
  .download-card span { font-size: 12px; color: var(--muted); }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(3,13,22,.82);
    backdrop-filter: blur(12px);
    display: grid;
    place-items: center;
    padding: 22px;
  }
  .generation-modal {
    width: min(100%, 560px);
    padding: 34px;
    border-radius: var(--radius-lg);
    background: var(--cream);
    color: var(--ink);
    box-shadow: var(--shadow);
  }
  .generation-modal h3 { margin: 0 0 8px; font-size: 28px; }
  .generation-modal > p { color: #6A7680; line-height: 1.6; }
  .generation-steps { display: grid; gap: 10px; margin-top: 24px; }
  .generation-step { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 12px; background: #ECE8DF; color: #7A858D; }
  .generation-step.active { color: var(--ink); background: rgba(24,183,122,.14); }
  .generation-step.done { color: #286D52; }
  .generation-step i { width: 9px; height: 9px; border-radius: 50%; background: #C4BFB6; }
  .generation-step.active i, .generation-step.done i { background: var(--emerald); }

  .toast {
    position: fixed;
    right: 24px;
    bottom: 24px;
    z-index: 200;
    max-width: 420px;
    padding: 16px 18px;
    border-radius: 14px;
    background: var(--cream);
    color: var(--ink);
    box-shadow: var(--shadow);
    animation: toastIn .25s ease;
  }
  .toast strong { display: block; margin-bottom: 5px; }
  .toast span { color: #68737B; font-size: 12px; line-height: 1.45; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

  .empty-note { color: var(--muted); line-height: 1.6; }
  .hidden { display: none !important; }

  @media (max-width: 980px) {
    .landing { grid-template-columns: 1fr; }
    .entry-panel { min-height: auto; border-left: 0; border-top: 1px solid var(--line); }
    .journey-grid { grid-template-columns: 1fr; }
    .sidebar { position: static; border-right: 0; border-bottom: 1px solid var(--line); }
    .step-list { display: flex; overflow-x: auto; padding-bottom: 4px; }
    .step-item { min-width: 180px; }
    .score-hero, .result-grid { grid-template-columns: 1fr; }
    .score-ring { margin: 0 auto; }
  }

  @media (max-width: 680px) {
    .topbar { padding: 0 16px; }
    .brand-copy span, .top-actions .btn-ghost { display: none; }
    .hero { padding: 110px 24px 70px; }
    .hero h1 { font-size: 46px; }
    .promise-grid { grid-template-columns: 1fr; }
    .entry-panel { padding: 20px; }
    .entry-card { padding: 24px; }
    .workspace { padding: 30px 16px; }
    .question-card { border-radius: 20px; padding: 20px; }
    .card-actions { flex-wrap: wrap; }
    .card-actions .btn { flex: 1; }
    .save-state { width: 100%; order: -1; }
    .generate-card { align-items: flex-start; flex-direction: column; }
    .downloads { grid-template-columns: 1fr; }
  }

  .brand-logo-wrap {
  width: 52px;
  height: 52px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border-radius: 14px;
  background: #ffffff;
  padding: 4px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
}

.brand-logo {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: contain;
  border-radius: 10px;
}
@media (max-width: 720px) {
  .brand-logo-wrap {
    width: 44px;
    height: 44px;
    border-radius: 12px;
  }
}

  /* Private project asset sidebar */
  .ag24-asset-panel { margin-top:24px; padding:17px; border:1px solid var(--line); border-radius:18px; background:rgba(255,255,255,.035); display:grid; gap:11px; }
  .ag24-asset-panel h3 { margin:0; color:var(--white); font-size:16px; }
  .ag24-asset-panel p, .ag24-asset-panel small { color:var(--muted); font-size:12px; line-height:1.55; margin:0; }
  .ag24-asset-panel label { color:var(--white); font-weight:750; font-size:12px; }
  .ag24-asset-panel select, .ag24-asset-panel input[type=file] { max-width:100%; min-width:0; width:100%; padding:10px; border:1px solid var(--line); border-radius:9px; background:var(--navy-2); color:var(--white); }
  .ag24-asset-panel .btn { min-height:38px; font-size:12px; }
  .ag24-assets-list { display:grid; gap:9px; }
  .ag24-asset-item { padding:11px; border-radius:11px; border:1px solid var(--line); overflow-wrap:anywhere; }
  .ag24-asset-item strong { display:block; font-size:12px; color:var(--white); }
  .ag24-asset-item span { color:var(--muted); font-size:10px; }
  .ag24-asset-actions { display:flex; gap:10px; margin-top:8px; }
  .ag24-asset-actions button { background:transparent; border:0; color:var(--emerald); font-size:12px; text-decoration:underline; cursor:pointer; padding:4px 0; }
  .ag24-asset-preview img { margin-top:9px; width:100%; max-height:160px; object-fit:contain; border-radius:8px; }


  .ag24-import-modal{width:min(850px,95vw);max-height:90vh;overflow-y:auto;background:#F7F4EC;
    color:#18212A;padding:clamp(18px,3vw,32px);border-radius:20px;}
  .ag24-import-modal h2{margin:0 0 10px;font-size:24px;}
  .ag24-import-modal>p{line-height:1.5;color:#53636F;}
  .ag24-import-list{display:grid;gap:10px;margin:15px 0;}
  .ag24-import-row{display:grid;grid-template-columns:20px minmax(0,1fr);gap:12px;
    padding:14px;border:1px solid #D8D5CE;border-radius:11px;line-height:1.55;}
  .ag24-import-row input{width:18px;height:18px;margin-top:5px;accent-color:#138251;}
  .ag24-import-row strong{display:block;font-size:13px;}
  .ag24-import-row small{display:block;color:#63707A;font-size:11px;margin:5px 0;overflow-wrap:anywhere;}
  .ag24-import-row em{display:block;font-style:normal;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;}
  .ag24-import-row:has(input:disabled){opacity:.65;}
  .ag24-import-footer{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;}

</style>
