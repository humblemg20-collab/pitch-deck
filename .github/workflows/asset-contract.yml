name: Pitch Asset Engine Contracts

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  asset-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify canonical upload, recovery and Slides contracts
        run: node --test tests/asset-engine.test.cjs tests/openai-import.test.cjs tests/resume-link.test.cjs tests/free-studio.test.cjs tests/server-surface.test.cjs tests/project-limit.test.cjs tests/deploy-contract.test.cjs tests/afrigreen-connector.test.cjs tests/pitch-presentation-v2-1.test.cjs tests/pitch-investor-v2-3.test.cjs tests/pitch-storytelling-v2-2.test.cjs tests/greenin-ai-brand.test.cjs
      - name: Verify PowerShell read-only backup comparison engine
        shell: pwsh
        run: ./tests/compare-script.test.ps1
      - name: Verify safe three-way release staging and live-only preservation
        shell: pwsh
        run: ./tests/stage-safe-release.test.ps1
      - name: Verify conflict diagnostics stay metadata-only
        shell: pwsh
        run: ./tests/inspect-release-conflicts.test.ps1

      - name: Export tested Apps Script source snapshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ag24-pitch-script-src
          if-no-files-found: error
          retention-days: 2
          include-hidden-files: false
          path: |
            *.js
            *.html
            appsscript.json
