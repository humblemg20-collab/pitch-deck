name: Pitch Asset Engine Contracts

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  asset-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify canonical upload, recovery and Slides contracts
        run: node --test tests/asset-engine.test.cjs tests/openai-import.test.cjs tests/resume-link.test.cjs
      - name: Verify PowerShell read-only backup comparison engine
        shell: pwsh
        run: ./tests/compare-script.test.ps1
      - name: Verify safe three-way release staging and live-only preservation
        shell: pwsh
        run: ./tests/stage-safe-release.test.ps1
