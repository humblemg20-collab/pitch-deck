<script>
(function() {
  'use strict';

  window.AG24_APP_SCRIPT_LOADED = true;

  const state = {
    bootstrap: null,
    schema: [],
    project: null,
    token: '',
    activeSection: 0,
    entryMode: 'create',
    saveTimer: null,
    saving: false,
    generationTimer: null,
    resumeUrl: '',
    assets: [],
    assetPreviews: {},
    assetBusy: false,
    imports: [],
    importBusy: false,
    savePromise: null
  };

  let app = null;

  function getAppRoot_() {
    if (!app) {
      app = document.getElementById('app');
    }
    return app;
  }

  function callServer(functionName, ...args) {
    return new Promise((resolve, reject) => {
      const runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(error => reject(error));
      runner[functionName](...args);
    });
  }

  function withTimeout_(promise, milliseconds, message) {
    return Promise.race([
      promise,
      new Promise((_, reject) => {
        window.setTimeout(() => {
          reject(new Error(message || 'Le serveur met trop de temps à répondre.'));
        }, milliseconds);
      })
    ]);
  }

  function unwrap(response) {
    if (!response || !response.ok) {
      const message = response && response.error ? response.error.message : 'Une erreur inattendue est survenue.';
      throw new Error(message);
    }
    return response.data;
  }

  function escapeHtml(value) {
    return String(value === null || value === undefined ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function getByPath(object, path) {
    return String(path || '').split('.').reduce((current, key) => current && Object.prototype.hasOwnProperty.call(current, key) ? current[key] : undefined, object);
  }

  function isConditionMet(field) {
    if (!field.condition) return true;
    return String(getByPath(state.project ? state.project.data : {}, field.condition.path) || '') === String(field.condition.equals);
  }

  function buildResumeUrl() {
    if (!state.project || !state.project.projectId || !state.token) return '';
    const configuredBase = state.bootstrap && state.bootstrap.config ? state.bootstrap.config.webAppUrl : '';
    const base = String(configuredBase || '').trim().split('?')[0];
    if (!base) return '';
    return base + '?project=' + encodeURIComponent(state.project.projectId) + '&token=' + encodeURIComponent(state.token);
  }

  function setUrl(projectId, token) {
    if (!projectId || !token) return;
    state.resumeUrl = buildResumeUrl();
    try {
      const url = new URL(window.location.href);
      url.searchParams.set('project', projectId);
      url.searchParams.set('token', token);
      window.history.replaceState({}, '', url.toString());
    } catch (error) {
      // L'URL interne de l'iframe Apps Script n'est pas utilisée comme lien de reprise.
    }
  }

  function clearUrl() {
    state.resumeUrl = '';

    try {
      const url = new URL(window.location.href);
      url.searchParams.delete('project');
      url.searchParams.delete('token');
      window.history.replaceState({}, '', url.toString());
    } catch (error) {
      console.warn("Impossible de nettoyer l'URL interne Apps Script :", error);
    }
  }

  function showToast(title, message, timeout) {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.innerHTML = `<strong>${escapeHtml(title)}</strong><span>${escapeHtml(message || '')}</span>`;
    document.body.appendChild(toast);
    window.setTimeout(() => toast.remove(), timeout || 3500);
  }

  function showFatal(message) {
    const root = getAppRoot_();

    if (!root) {
      document.body.innerHTML =
        '<div style="padding:24px;font-family:Arial,sans-serif">' +
        '<h2>Erreur de chargement</h2>' +
        '<p>' + escapeHtml(message || 'Élément #app introuvable.') + '</p>' +
        '</div>';
      return;
    }

    root.innerHTML = `
      <div class="boot-screen">
        <div class="brand-logo-wrap">
          <img
            src="https://img-thumb.mailinblue.com/10710656/images/content_library/original/6a681091b6fce5ac97246779.jpeg"
            alt="AfriGreen24"
            class="brand-logo"
            referrerpolicy="no-referrer"
          >
        </div>
        <h2>Configuration nécessaire</h2>
        <p>${escapeHtml(message)}</p>
      </div>`;
  }

  async function init() {
    try {
      app = document.getElementById('app');

      if (!app) {
        throw new Error(
          'Le conteneur #app est introuvable dans la page principale.'
        );
      }

      /*
       * Affiche immédiatement la page commerciale.
       * Ainsi, un problème de backend ne bloque plus l’écran
       * sur « Préparation de votre studio… ».
       */
      renderLanding();

      try {
        state.bootstrap = unwrap(
          await withTimeout_(
            callServer('apiBootstrap'),
            15000,
            'Le serveur met trop de temps à répondre.'
          )
        );

        state.schema = state.bootstrap.schema || [];
      } catch (bootstrapError) {
        console.error('Erreur apiBootstrap :', bootstrapError);

        showToast(
          'Connexion au serveur impossible',
          bootstrapError && bootstrapError.message
            ? bootstrapError.message
            : 'Vérifiez Api.gs et le déploiement Apps Script.',
          9000
        );

        return;
      }

      const initial = window.AG24_INITIAL_STATE || {};

      if (initial.projectId && initial.token) {
        try {
          const loaded = unwrap(
            await withTimeout_(
              callServer(
                'apiLoadProject',
                initial.projectId,
                initial.token
              ),
              15000,
              'Le projet met trop de temps à se charger.'
            )
          );

          state.project = loaded.project;
          state.token = initial.token;
          state.resumeUrl = buildResumeUrl();

          renderJourney();
          refreshProjectAssets();
          return;

        } catch (error) {
          showToast(
            'Lien non valide',
            error && error.message
              ? error.message
              : 'Impossible de reprendre ce projet.',
            6000
          );
        }
      }

    } catch (error) {
      showFatal(
        error && error.message
          ? error.message
          : 'Erreur de chargement de l’application.'
      );
    }
  }

  function unwrapPaymentResponse(response) {
    if (response && response.ok === true) {
      return unwrap(response);
    }

    if (response && response.success === true) {
      return response.data;
    }

    const message =
      response &&
      response.error &&
      response.error.message
        ? response.error.message
        : response && typeof response.error === 'string'
          ? response.error
          : 'Une erreur est survenue pendant la vérification du paiement.';

    throw new Error(message);
  }

  async function verifyPaymentAccessBeforeCreation(
    email,
    paymentAccessCode
  ) {
    const response = await callServer(
      'apiVerifyPitchAccess',
      email,
      paymentAccessCode
    );

    const verification = unwrapPaymentResponse(response);

    if (!verification || !verification.valid) {
      throw new Error(
        verification && verification.message
          ? verification.message
          : 'Votre accès au Pitch Deck n’est pas valide.'
      );
    }

    return verification;
  }

}

function bindLandingEvents() {
  document
    .querySelectorAll('[data-selar-payment]')

  document

    .forEach(button => {

        renderLanding();

  const createForm =

    createForm.addEventListener(
      'submit',
      async event => {
        event.preventDefault();

        const button = createForm.querySelector(
          'button[type="submit"]'
        );

        const originalText = button
          ? button.textContent
          : 'Vérifier mon accès et commencer';

        if (button) {
          button.disabled = true;
          button.textContent =
            'Vérification du paiement…';
        }

        try {
          const form = new FormData(createForm);

          const projectName = String(
            form.get('projectName') || ''
          ).trim();

          const email = String(
            form.get('email') || ''
          )
            .trim()
            .toLowerCase();

          const paymentAccessCode = String(
            form.get('paymentAccessCode') || ''
          )
            .trim()
            .toUpperCase();

          const consent = Boolean(
            form.get('consent')
          );


          if (!projectName) {
            throw new Error(
              'Veuillez saisir le nom de votre projet.'
            );
          }

          if (!email) {
            throw new Error(
              'Veuillez saisir l’e-mail utilisé pour le paiement.'
            );
          }

          if (!paymentAccessCode) {
            throw new Error(
              'Veuillez saisir votre code d’accès.'
            );
          }

          if (!consent) {
            throw new Error(
              'Vous devez accepter la déclaration avant de continuer.'
            );

          await verifyPaymentAccessBeforeCreation(
            email,
            paymentAccessCode
          );


          if (button) {
            button.textContent =
              'Création de votre espace…';
          }


          const result = unwrap(
            await callServer(
              'apiCreateProject',
              {
                projectName: projectName,
                email: email,
                paymentAccessCode: paymentAccessCode,
                consent: consent
              }
            )
          );


          state.project = result.project;
          state.token = result.token;
          state.resumeUrl = result.resumeUrl || '';
          state.activeSection = 0;


          setUrl(
            state.project.projectId,
            state.token

          refreshProjectAssets();

  // Files are references to Drive assets, never embedded in questionnaire data.

    const options = [

            ? '<button type="button" data-action="preview-asset">Aperçu</button>'
            : '<button type="button" data-action="analyze-asset">' +
                (findLatestImport_(asset.assetId) && findLatestImport_(asset.assetId).status === 'READY'
                  ? 'Vérifier les propositions' :

                  ? 'Voir l’analyse appliquée' :

                  ? 'Actualiser l’analyse' :

  function findLatestImport_(assetId) {
    return state.imports.find(function(entry) { return entry.assetId === assetId; }) || null;
  }

  async function refreshProjectAssets() {
    if (!state.project || !state.token) return;
    const requestedProject = state.project.projectId;
    try {
      const results = await Promise.all([
        callServer('apiListProjectAssets', requestedProject, state.token),
        callServer('apiListDocumentAnalyses', requestedProject, state.token)
      ]);
      const result = unwrap(results[0]);
      const analyses = unwrap(results[1]);
      if (!state.project || state.project.projectId !== requestedProject) return;
      state.assets = result.assets || [];
      state.imports = (analyses.imports || []).slice().reverse();
      const panel = document.getElementById('ag24-asset-panel');
      if (panel) {
        panel.outerHTML = renderAssetPanel();
        bindAssetEvents();
      }
    } catch (error) {
      showToast('Documents non chargés',
        error && error.message ? error.message : 'Impossible de charger les pièces jointes.', 6500);
    }
  }

  function readProjectAsset_(file) {
    return new Promise(function(resolve, reject) {
      const reader = new FileReader();
      reader.onerror = function() { reject(new Error('Lecture du fichier impossible.')); };
      reader.onload = function() {
        const encoded = String(reader.result || '').split(',')[1] || '';
        if (!encoded) return reject(new Error('Fichier vide.'));
        resolve(encoded);
      };
      reader.readAsDataURL(file);
    });
  }

  function bindAssetEvents() {
    const panel = document.getElementById('ag24-asset-panel');
    if (!panel) return;
    const upload = panel.querySelector('[data-action="upload-project-asset"]');
    if (upload) upload.addEventListener('click', async function() {
      if (state.assetBusy) return;
      const file = panel.querySelector('#ag24-asset-file').files[0];
      const role = panel.querySelector('#ag24-asset-role').value;
      if (!file) return showToast('Fichier manquant', 'Sélectionnez un fichier.', 4000);
      const image = role !== 'SOURCE_DOCUMENT';
      const maxBytes = (image ? 2 : 8) * 1024 * 1024;
      if (!file.size || file.size > maxBytes) {
        return showToast('Fichier trop volumineux',
          'Limite : ' + (image ? '2 Mo pour une image.' : '8 Mo pour un document.'), 5000);
      }
      state.assetBusy = true;
      upload.disabled = true;
      upload.textContent = 'Enregistrement…';
      try {
        const base64 = await readProjectAsset_(file);
        const result = unwrap(await callServer('apiUploadProjectAsset', {
          projectId: state.project.projectId, token: state.token,
          role: role, fileName: file.name,
          mimeType: file.type, size: file.size, base64: base64
        }));
        if (!result.deduplicated && state.project) {
          state.project.slidesUrl = '';
          state.project.pdfUrl = '';
        }
        await refreshProjectAssets();
        showToast(result.deduplicated ? 'Fichier déjà enregistré' : 'Fichier enregistré',
          'Il est lié au projet et sera disponible après reprise.', 4500);
      } catch (error) {
        showToast('Upload refusé', error && error.message ? error.message : 'Upload impossible.', 6500);
      } finally {
        state.assetBusy = false;
        upload.disabled = false;
        upload.textContent = 'Ajouter au dossier';
      }
    });


    panel.querySelectorAll('[data-action="analyze-asset"]').forEach(function(button) {
      button.addEventListener('click', async function() {
        const item = button.closest('[data-asset-id]');
        if (!item || state.importBusy) return;
        const assetId = item.dataset.assetId;
        const latest = findLatestImport_(assetId);
        if (latest && (latest.status === 'READY' || latest.status === 'APPLIED')) {
          return openPitchDocumentReview_(latest.importId);
        }
        if (latest && latest.status === 'RUNNING') {
          await refreshProjectAssets();
          return showToast('Analyse en cours', 'Actualisez après la réponse du serveur.', 4500);
        }
        if (!window.confirm(
          'Autoriser l’analyse de ce document par OpenAI ? Le fichier sera transmis au service OpenAI pour proposer des réponses. Aucun champ ne sera modifié sans votre validation.'
        )) return;
        state.importBusy = true;
        button.disabled = true;
        button.textContent = 'Analyse OpenAI…';
        try {
          const health = unwrap(await callServer('apiPitchOpenAIHealth',
            state.project.projectId, state.token));
          if (!health.configured) {
            throw new Error('OpenAI non configuré côté serveur. Contactez AfriGreen24.');
          }
          const result = unwrap(await callServer('apiAnalyzeProjectDocument',{
            projectId:state.project.projectId,token:state.token,assetId:assetId
          }));
          await refreshProjectAssets();
          if (result.import && (result.import.status === 'READY' ||
              result.import.status === 'APPLIED')) {
            await openPitchDocumentReview_(result.import.importId);
          } else {
            showToast('Analyse enregistrée', 'Le statut est récupérable après une reprise.', 6000);
          }
        } catch (error) {
          showToast('Analyse interrompue',
            error && error.message ? error.message : 'Erreur OpenAI.', 7000);
          await refreshProjectAssets();
        } finally {
          state.importBusy = false;
          button.disabled = false;
        }
      });
    });

    panel.querySelectorAll('[data-action="preview-asset"]').forEach(function(button) {
      button.addEventListener('click', async function() {
        const item = button.closest('[data-asset-id]');
        if (!item) return;
        button.disabled = true;
        try {
          const result = unwrap(await callServer('apiGetProjectImageData',
            state.project.projectId, state.token, item.dataset.assetId));
          const container = item.querySelector('.ag24-asset-preview');
          const img = document.createElement('img');
          img.alt = 'Aperçu du visuel';
          img.src = result.dataUrl;
          container.textContent = '';
          container.appendChild(img);
        } catch (error) {
          showToast('Aperçu indisponible', error.message, 5000);
        } finally { button.disabled = false; }
      });
    });

    panel.querySelectorAll('[data-action="delete-asset"]').forEach(function(button) {
      button.addEventListener('click', async function() {
        const item = button.closest('[data-asset-id]');
        if (!item || !window.confirm('Retirer ce fichier du projet ?')) return;
        button.disabled = true;
        try {
          unwrap(await callServer('apiDeleteProjectAsset', {
            projectId: state.project.projectId, token: state.token,
            assetId: item.dataset.assetId
          }));
          if (state.project) {
            state.project.slidesUrl = '';
            state.project.pdfUrl = '';
          }
          await refreshProjectAssets();
          showToast('Fichier retiré', 'Le registre du projet a été mis à jour.', 4500);
        } catch (error) {
          showToast('Suppression impossible', error.message, 6000);
          button.disabled = false;
        }
      });
    });
  }


  async function openPitchDocumentReview_(importId) {
    const result = unwrap(await callServer('apiGetDocumentAnalysis',
      state.project.projectId,state.token,importId));
    const currentProjectId = state.project.projectId;
    const overlay = document.createElement('div');
    overlay.className = 'modal-backdrop';
    overlay.id = 'ag24-import-review';
    const fields = result.fields || [];
    const suggestions = fields.map(function(field) {
      const current = getByPath(state.project.data || {}, field.path);
      const filled = current !== null && current !== undefined &&
        String(current).trim() !== '';
      return '<label class="ag24-import-row">' +
        '<input type="checkbox" data-import-path="' + escapeHtml(field.path) + '"' +
          (filled ? ' disabled' : ' checked') + '>' +
        '<span><strong>' + escapeHtml(field.path) + '</strong>' +
        '<small>' + escapeHtml(field.evidence) + ' · Confiance ' +
          Math.round(Number(field.confidence||0)*100) + '%</small>' +
        '<em>' + escapeHtml(field.value) + '</em>' +
        (filled ? '<small>Réponse existante préservée : ' +
          escapeHtml(String(current).slice(0,180)) + '</small>' : '') +
        '</span></label>';
    }).join('');
    overlay.innerHTML =
      '<section class="ag24-import-modal" role="dialog" aria-modal="true">' +
      '<h2>Propositions OpenAI à vérifier</h2>' +
      '<p>Les preuves citées par l’IA doivent être confrontées au document. Aucune proposition n’est appliquée automatiquement.</p>' +
      '<p>' + fields.length + ' proposition(s) extraites · Import ' + escapeHtml(importId) + '</p>' +
      '<div class="ag24-import-list">' +
        (suggestions || '<p>Aucune proposition fiable détectée.</p>') +
      '</div><div class="ag24-import-footer">' +
      '<button class="btn btn-secondary" type="button" data-import-cancel>Fermer</button>' +
      (result.import.status === 'APPLIED' ? '' :
        '<button class="btn btn-primary" type="button" data-import-apply>Valider les champs cochés</button>') +
      '</div></section>';
    document.body.appendChild(overlay);
    overlay.querySelector('[data-import-cancel]').addEventListener('click',function() {
      overlay.remove();
    });
    const apply = overlay.querySelector('[data-import-apply]');
    if (!apply) return;
    apply.addEventListener('click',async function() {
      const paths = Array.from(overlay.querySelectorAll(
        '[data-import-path]:checked:not(:disabled)')).map(function(el) {
        return el.dataset.importPath;
      });
      if (!paths.length) {
        return showToast('Aucun champ choisi', 'Sélectionnez au moins une proposition.', 4000);
      }
      apply.disabled = true;
      apply.textContent = 'Validation…';
      try {
        const response = unwrap(await callServer('apiApplyDocumentAnalysis',{
          projectId:currentProjectId,token:state.token,importId:importId,paths:paths
        }));
        if (!state.project || state.project.projectId !== currentProjectId) {
          overlay.remove();return;
        }
        state.project = response.project;
        overlay.remove();
        renderJourney();
        refreshProjectAssets();
        showToast('Import validé',response.applied.length +
          ' champ(s) renseigné(s), ' + response.skipped.length +
          ' conservé(s) sans écrasement.',6500);
      } catch(error) {
        showToast('Validation échouée',error.message,7000);
        apply.disabled = false;
        apply.textContent = 'Valider les champs cochés';
      }
    });
  }

  function renderStep(section, index, progress) {
    const status = progress.sections && progress.sections[section.id] ? progress.sections[section.id] : { status: 'À commencer', percent: 0 };
    return `
      <button class="step-item ${index === state.activeSection ? 'active' : ''}" data-step="${index}">
        <span class="step-index">${String(index + 1).padStart(2, '0')}</span>
        <span class="step-copy"><strong>${escapeHtml(section.title)}</strong><span>${escapeHtml(status.status)}</span></span>
        <span class="step-dot ${status.percent === 100 ? 'complete' : ''}"></span>
      </button>`;
  }

  function renderField(sectionId, field) {
    const path = `${sectionId}.${field.id}`;
    const value = getByPath(state.project.data || {}, path);
    const required = field.required ? '<span class="required">*</span>' : '';
    const help = field.help ? `<div class="field-help">${escapeHtml(field.help)}</div>` : '';
    let control = '';

    if (field.type === 'textarea') {
      control = `<textarea id="${path}" data-field="${field.id}" data-section="${sectionId}" maxlength="${field.maxLength || 6000}" placeholder="${escapeHtml(field.placeholder || '')}">${escapeHtml(value || '')}</textarea>`;
    } else if (field.type === 'select') {
      control = `<select id="${path}" data-field="${field.id}" data-section="${sectionId}">
        <option value="">Sélectionner</option>
        ${(field.options || []).map(option => `<option value="${escapeHtml(option)}" ${String(value || '') === String(option) ? 'selected' : ''}>${escapeHtml(option)}</option>`).join('')}
      </select>`;
    } else if (field.type === 'checkbox') {
      return `
        <div class="field" data-field-wrap="${field.id}">
          <div class="checkbox-line">
            <input id="${path}" data-field="${field.id}" data-section="${sectionId}" type="checkbox" ${value === true || value === 'true' ? 'checked' : ''}>
            <label for="${path}">${escapeHtml(field.label)} ${required}</label>
          </div>
          ${help}
          <div class="field-error" data-error-for="${field.id}"></div>
        </div>`;
    } else {
      control = `<input id="${path}" data-field="${field.id}" data-section="${sectionId}" type="${field.type || 'text'}" value="${escapeHtml(value || '')}" placeholder="${escapeHtml(field.placeholder || '')}">`;
    }

    return `
      <div class="field" data-field-wrap="${field.id}">
        <label for="${path}">${escapeHtml(field.label)} ${required}</label>
        ${control}
        ${help}
        <div class="field-error" data-error-for="${field.id}"></div>
      </div>`;
  }

  function bindJourneyEvents() {
    document.querySelectorAll('[data-step]').forEach(button => {
      button.addEventListener('click', async () => {
        await saveCurrentSection(false);
        state.activeSection = Number(button.dataset.step);
        renderJourney();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });

    document.querySelectorAll('[data-field]').forEach(input => {
      const handler = () => {
        updateLocalSectionValue(input);
        scheduleSave();
        if (input.tagName === 'SELECT') renderJourneyKeepingFocus();
      };
      input.addEventListener('input', handler);
      input.addEventListener('change', handler);
    });

    const previous = document.querySelector('[data-action="previous"]');
    if (previous) previous.addEventListener('click', async () => {
      await saveCurrentSection(false);
      state.activeSection = Math.max(0, state.activeSection - 1);
      renderJourney();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    const next = document.querySelector('[data-action="next"]');
    if (next) next.addEventListener('click', async () => {
      if (!validateCurrentSection()) {
        showToast('Informations à compléter', 'Vérifiez les champs obligatoires de cette étape.', 4000);
        return;
      }
      next.disabled = true;
      try {
        await saveCurrentSection(true);
        if (state.activeSection === state.schema.length - 1) {
          await analyzeAndRender();
        } else {
          state.activeSection += 1;
          renderJourney();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      } catch (error) {
        showToast('Enregistrement impossible', error.message, 5000);
        next.disabled = false;
      }
    });

    bindTopbarEvents();
  }

  function renderJourneyKeepingFocus() {
    const activeId = document.activeElement ? document.activeElement.id : '';
    renderJourney();
    if (activeId) {
      const element = document.getElementById(activeId);
      if (element) element.focus();
    }
  }

  function bindTopbarEvents() {
    const copy = document.querySelector('[data-action="copy-resume"]');
    if (copy) copy.addEventListener('click', async () => {
      const resumeUrl = state.resumeUrl || buildResumeUrl();
      if (!resumeUrl) {
        showToast('Lien indisponible', 'Redéployez l’application Web puis relancez la fonction setupAfriGreen24PitchDeck().', 6500);
        return;
      }
      state.resumeUrl = resumeUrl;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(resumeUrl);
        } else {
          const helper = document.createElement('textarea');
          helper.value = resumeUrl;
          helper.setAttribute('readonly', '');
          helper.style.position = 'fixed';
          helper.style.opacity = '0';
          document.body.appendChild(helper);
          helper.select();
          document.execCommand('copy');
          helper.remove();
        }
        showToast('Lien privé copié', 'Le lien /exec du projet a été copié. Conservez-le dans un espace privé.', 4000);
      } catch (error) {
        window.prompt('Copiez votre lien privé :', resumeUrl);
      }
    });
    const analyze = document.querySelector('[data-action="analyze"]');
    if (analyze) analyze.addEventListener('click', analyzeAndRender);
  }

  function updateLocalSectionValue(input) {
    const sectionId = input.dataset.section;
    const fieldId = input.dataset.field;
    state.project.data = state.project.data || {};
    state.project.data[sectionId] = state.project.data[sectionId] || {};
    state.project.data[sectionId][fieldId] = input.type === 'checkbox' ? input.checked : input.value;
  }

  function collectCurrentSection() {
    const section = state.schema[state.activeSection];
    const values = {};
    document.querySelectorAll(`[data-section="${section.id}"]`).forEach(input => {
      values[input.dataset.field] = input.type === 'checkbox' ? input.checked : input.value;
    });
    return values;
  }

  function scheduleSave() {
    window.clearTimeout(state.saveTimer);
    const indicator = document.getElementById('save-state');
    if (indicator) {
      indicator.textContent = 'Modifications en attente…';
      indicator.className = 'save-state';
    }
    state.saveTimer = window.setTimeout(() => {
      saveCurrentSection(false).catch(function(error) {
        showToast('Sauvegarde non effectuée', error.message, 6000);
      });
    }, 900);
  }

  async function saveCurrentSection(showEncouragement) {
    if (!state.project) return;
    // Every call joins the serialization chain, including navigation calls.
    const previous = state.savePromise || Promise.resolve();
    const operation = previous.then(async function() {
      const section = state.schema[state.activeSection];
      const values = collectCurrentSection();
      const indicator = document.getElementById('save-state');
      state.saving = true;
      if (indicator) {
        indicator.textContent = 'Enregistrement…';
        indicator.className = 'save-state';
      }
      try {
        const result = unwrap(await callServer('apiSaveSection', {
          projectId: state.project.projectId,
          token: state.token,
          sectionId: section.id,
          values: values
        }));
        // Preserve local typing which occurred while the RPC was in flight.
        const latest = collectCurrentSection();
        state.project = result.project;
        if (state.schema[state.activeSection].id === section.id) {
          Object.assign(state.project.data[section.id], latest);
        }
        if (indicator) {
          indicator.textContent = 'Toutes vos réponses sont enregistrées.';
          indicator.className = 'save-state saved';
        }
        if (showEncouragement) showToast('Étape enregistrée', result.encouragement, 3500);
      } catch (error) {
        if (indicator) {
          indicator.textContent = 'Échec de l’enregistrement.';
          indicator.className = 'save-state error';
        }
        throw error;
      } finally {
        state.saving = false;
      }
    });
    state.savePromise = operation;
    try { return await operation; }
    finally { if (state.savePromise === operation) state.savePromise = null; }
  }

  function validateCurrentSection() {
    const section = state.schema[state.activeSection];
    let valid = true;
    section.fields.filter(isConditionMet).forEach(field => {
      if (!field.required) return;
      const input = document.querySelector(`[data-section="${section.id}"][data-field="${field.id}"]`);
      const error = document.querySelector(`[data-error-for="${field.id}"]`);
      const filled = input && (input.type === 'checkbox' ? input.checked : String(input.value || '').trim().length > 0);
      if (!filled) {
        valid = false;
        if (error) error.textContent = 'Cette information est nécessaire pour continuer.';
      } else if (error) {
        error.textContent = '';
      }
    });
    return valid;
  }

  async function analyzeAndRender() {
    try {
      const result = unwrap(await callServer('apiAnalyzeProject', state.project.projectId, state.token));
      state.project = result.project;
      renderResults();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (error) {
      showToast('Analyse impossible', error.message, 5000);
    }
  }

  function renderResults() {
    const score = state.project.score || { total: 0, label: 'À analyser', categories: [], criticalCount: 0, eligibleForFinancable: false };
    const alerts = state.project.alerts || [];
    const importantAlerts = alerts.filter(alert => alert.level !== 'information').slice(0, 10);
    const critical = alerts.filter(alert => alert.level === 'critique').length;
    const root = getAppRoot_();

    if (!root) {
      throw new Error('Élément principal #app introuvable.');
    }

    root.innerHTML = `
      <div class="journey-shell">
        ${renderTopbar()}
        <main class="workspace">
          <div class="review-panel">
            <section class="score-hero">
              <div class="score-ring" style="--score-deg:${Math.max(0, Math.min(100, score.total || 0)) * 3.6}deg">
                <div class="score-value"><strong>${score.total || 0}</strong><span>sur 100</span></div>
              </div>
              <div class="score-copy">
                <span class="eyebrow">Pitch Readiness Score</span>
                <h2>${escapeHtml(score.label || '')}</h2>
                <p>${escapeHtml(score.interpretation || '')}</p>
                <div class="score-meta">
                  <span class="pill">${state.project.progress ? state.project.progress.percent : 0}% du questionnaire</span>
                  <span class="pill">${critical} alerte(s) critique(s)</span>
                  <span class="pill">${score.eligibleForFinancable ? 'Éligible au Finançable' : 'Standard recommandé'}</span>
                </div>
              </div>
            </section>

            <div class="result-grid">
              <section class="panel">
                <h3>Recommandations prioritaires</h3>
                <div class="alert-list">
                  ${importantAlerts.length ? importantAlerts.map(renderAlert).join('') : '<p class="empty-note">Aucune alerte importante détectée. Une relecture humaine reste recommandée.</p>'}
                </div>
              </section>
              <section class="panel">
                <h3>Détail du score</h3>
                <div class="category-list">
                  ${(score.categories || []).map(renderCategory).join('')}
                </div>
              </section>
            </div>

            <section class="generate-card">
              <div>
                <h3>${state.project.slidesUrl ? 'Votre Pitch Deck Standard est prêt' : 'Générer votre Pitch Deck Standard'}</h3>
                <p>${state.project.slidesUrl ? 'Retrouvez les deux formats ci-dessous. Vérifiez chaque donnée avant toute présentation.' : 'Le système va structurer vos réponses, créer les 12 slides et exporter le PDF.'}</p>
                ${state.project.slidesUrl ? `
                  <div class="downloads">
                    <a class="download-card" href="${escapeHtml(state.project.slidesUrl)}" target="_blank"><strong>Google Slides</strong><span>Version modifiable</span></a>
                    <a class="download-card" href="${escapeHtml(state.project.pdfUrl)}" target="_blank"><strong>Document PDF</strong><span>Version de présentation</span></a>
                  </div>` : ''}
              </div>
              <div>
                ${state.project.slidesUrl
                  ? '<button class="btn btn-secondary" data-action="edit-project">Modifier mes réponses</button>'
                  : '<button class="btn btn-primary btn-large" data-action="generate-deck">Générer maintenant</button>'}
              </div>
            </section>
          </div>
        </main>
      </div>`;
    bindResultEvents();
    bindTopbarEvents();
  }

  function renderAlert(alert) {
    return `
      <div class="alert-item ${escapeHtml(alert.level || '')}">
        <strong>${escapeHtml(alert.title || '')}</strong>
        <p>${escapeHtml(alert.message || '')}</p>
        <small>${escapeHtml(alert.recommendation || '')}</small>
      </div>`;
  }

  function renderCategory(item) {
    const percent = item.weight ? Math.round((item.points / item.weight) * 100) : 0;
    return `
      <div class="category-row">
        <span>${escapeHtml(item.label)}</span>
        <strong>${item.points}/${item.weight}</strong>
        <div class="category-bar"><i style="width:${Math.max(0, Math.min(100, percent))}%"></i></div>
      </div>`;
  }

  function bindResultEvents() {
    const edit = document.querySelector('[data-action="edit-project"]');
    if (edit) edit.addEventListener('click', () => {
      state.activeSection = 0;
      renderJourney();
    });
    const generate = document.querySelector('[data-action="generate-deck"]');
    if (generate) generate.addEventListener('click', generateDeck);
  }

  async function generateDeck() {
    if (!state.project) {
      showToast('Projet introuvable', 'Rechargez la page puis reprenez votre projet.', 5000);
      return;
    }

    const declaration = Boolean(
      state.project.data &&
      state.project.data.review &&
      (
        state.project.data.review.declaration === true ||
        state.project.data.review.declaration === 'true'
      )
    );

    if (!declaration) {
      showToast(
        'Déclaration obligatoire',
        'Retournez à l’étape 9 et confirmez la déclaration de sincérité avant la génération.',
        6000
      );
      return;
    }

    showGenerationModal();

    try {
      const result = unwrap(
        await callServer(
          'apiGenerateStandardDeck',
          state.project.projectId,
          state.token
        )
      );

      state.project = result.project;
      finishGenerationSteps();

      window.setTimeout(() => {
        closeGenerationModal();
        renderResults();
        showToast(
          'Pitch Deck généré',
          'Les versions Google Slides et PDF sont disponibles.',
          5000
        );
      }, 900);

    } catch (error) {
      closeGenerationModal();
      showToast(
        'Génération impossible',
        error && error.message ? error.message : 'Une erreur est survenue pendant la génération.',
        7000
      );
    }
  }

  function showGenerationModal() {
    const existing = document.getElementById('generation-modal');
    if (existing) existing.remove();

    const modal = document.createElement('div');
    modal.id = 'generation-modal';
    modal.className = 'modal-backdrop';

    modal.innerHTML = `
      <div class="generation-modal">
        <span class="eyebrow">Création en cours</span>
        <h3>Nous structurons votre présentation.</h3>
        <p>Ne fermez pas cette fenêtre pendant la génération des fichiers.</p>

        <div class="generation-steps">
          ${[
            'Analyse des réponses',
            'Construction de la narration',
            'Vérification des informations',
            'Création des 12 slides',
            'Export du PDF'
          ].map((label, index) => `
            <div
              class="generation-step ${index === 0 ? 'active' : ''}"
              data-generation-step="${index}"
            >
              <i></i>
              <span>${label}</span>
            </div>
          `).join('')}
        </div>
      </div>
    `;

    document.body.appendChild(modal);

    let current = 0;

    state.generationTimer = window.setInterval(() => {
      const steps = Array.from(
        document.querySelectorAll('[data-generation-step]')
      );

      if (!steps.length) return;

      steps.forEach((step, index) => {
        step.classList.toggle('done', index < current);
        step.classList.toggle('active', index === current);
      });

      current = Math.min(current + 1, steps.length - 1);
    }, 1200);
  }

  function finishGenerationSteps() {
    window.clearInterval(state.generationTimer);

    document.querySelectorAll('[data-generation-step]').forEach(step => {
      step.classList.remove('active');
      step.classList.add('done');
    });
  }

  function closeGenerationModal() {
    window.clearInterval(state.generationTimer);

    const modal = document.getElementById('generation-modal');
    if (modal) modal.remove();
  }

  // Démarrage robuste dans l’iframe Google Apps Script.
  window.setTimeout(function() {
    init();
  }, 0);
})();
</script>
